# scheduler — 控制面（etcd 选主，2 副本 HA）。
# 任意时刻仅 Leader 运行 Reconciler 主循环；两个副本都提供管理 gRPC API，
# gateway 通过 dolphin-scheduler Service 负载均衡即可。
# 关键点：DOLPHIN_ADVERTISE_ADDR 用 Downward API 取 Pod IP 拼成 <podIP>:50051，
# 否则 Worker 从 etcd 发现的 leader-addr 会是各 Pod 自己的 localhost，连不上。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: dolphin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      # 等待依赖就绪再启动主容器：scheduler 启动时连不上 MySQL 会直接退出（fail-fast），
      # mysql:8.0 首次初始化 hostPath 卷要 ~90s，之前每次新部署 scheduler 都崩溃重启 ~90s。
      # initContainer 用已加载的 scheduler 镜像（alpine 自带 busybox nc）轮询等待三个依赖端口。
      # 逐依赖分开轮询并打印等待对象：kind 冷启动时 CoreDNS/服务就绪有抖动，
      # 一旦卡住，日志能直接看出在等 mysql 还是 etcd 还是 redis（CI run #20 后加的诊断）。
      initContainers:
        - name: wait-for-infra
          image: dolphin-scheduler:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z dolphin-mysql 3306; do echo 'waiting mysql:3306'; sleep 2; done; until nc -z dolphin-etcd 2379; do echo 'waiting etcd:2379'; sleep 2; done; until nc -z dolphin-redis 6379; do echo 'waiting redis:6379'; sleep 2; done; echo 'infra ready: mysql+etcd+redis'"]
      containers:
        - name: scheduler
          image: dolphin-scheduler:latest
          imagePullPolicy: IfNotPresent
          args: ["-config", "/app/configs/scheduler.yaml"]
          env:
            # 顺序重要：$(POD_IP) 引用的是同容器内先前定义的变量。
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DOLPHIN_ADVERTISE_ADDR
              value: "$(POD_IP):50051"
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /app/configs
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: dolphin-scheduler-config
---
apiVersion: v1
kind: Service
metadata:
  name: dolphin-scheduler
  namespace: dolphin
spec:
  selector:
    app: scheduler
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: http
      port: 9090
      targetPort: 9090
