# etcd — 单节点 StatefulSet（演示/开发规模）。
# 生产建议扩成 3 节点并去掉 --initial-cluster-state=new 之外的静态集群配置，
# 或改用 etcd-operator / 托管的 etcd（如云厂商 KMS、AKE）。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: dolphin
spec:
  serviceName: dolphin-etcd
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.14
          command:
            - /usr/local/bin/etcd
            - --name=default
            - --data-dir=/etcd-data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://dolphin-etcd:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://dolphin-etcd:2380
            - --initial-cluster=default=http://dolphin-etcd:2380
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2380
          volumeMounts:
            - name: data
              mountPath: /etcd-data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
  # StatefulSet 使用 volumeClaimTemplate 为每个副本提供独立 PVC（数据不随 Pod 重建丢失）。
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Headless Service：为 StatefulSet 提供稳定的网络标识，也供应用通过 dolphin-etcd:2379 访问。
apiVersion: v1
kind: Service
metadata:
  name: dolphin-etcd
  namespace: dolphin
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
