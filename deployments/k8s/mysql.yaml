apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: dolphin
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: dolphin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "dolphin"
            - name: MYSQL_DATABASE
              value: "dolphin"
          args:
            - --default-authentication-plugin=mysql_native_password
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            # 用 TCP 探测，避免依赖 socket 路径：CI 里 mysql:8.0 实际 socket 在
            # /var/lib/mysql/mysql.sock，而 `-h localhost` 找 /var/run/mysqld/mysqld.sock，
            # 导致 pod 永远 Ready 不了（日志里有 34 次 Readiness probe failed）。
            # 应用与 initContainer 都走 TCP 3306，探针应与之保持一致。
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dolphin-mysql
  namespace: dolphin
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
