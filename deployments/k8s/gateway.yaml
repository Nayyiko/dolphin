# gateway — 接入面（同步 API）。
# NodePort 30080 供集群外访问（本地/云环境也可改 LoadBalancer）。
# 多个副本共享 Redis 令牌桶，限流在多实例间不翻倍（见 docs/benchmark.md 证据 4b）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: dolphin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: dolphin-gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["-config", "/app/configs/gateway.yaml"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/configs
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: dolphin-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: dolphin-gateway
  namespace: dolphin
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
