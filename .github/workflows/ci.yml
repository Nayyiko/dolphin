name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  KIND_VERSION: "v0.32.0"
  KUBECTL_VERSION: "v1.32.0"
  # 覆盖率门禁作用在核心逻辑包上：
  # - 排除 cmd/*（进程入口）、api/proto/pb（生成代码）——正常无测试，会稀释真实覆盖率
  # - 排除连接型集成包（election/manager/redisutil/etcdutil/config/metrics/tracing/model）——
  #   它们测的是与外部服务交互，本地单测天然弱，属于集成测试范畴
  # 其余核心逻辑包聚合覆盖率 56.8%（本地复现），阈值 50%
  COVER_PKGS: >-
    ./internal/gateway/middleware ./internal/gateway/proxy ./internal/gateway/router
    ./internal/pkg/ratelog
    ./internal/scheduler/cron ./internal/scheduler/dag ./internal/scheduler/executor
    ./internal/scheduler/informer ./internal/scheduler/queue ./internal/scheduler/reconciler
    ./internal/worker/executor

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════ Stage 1: Lint & Test — 快速失败门禁 ═══════════
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Unit Tests (race, all packages)
        run: go test -race -count=1 ./...

      - name: Coverage (core packages)
        run: go test -race -count=1 -coverprofile=coverage.out $COVER_PKGS

      - name: Coverage Check
        run: |
          COVERAGE=$(go tool cover -func=coverage.out 2>/dev/null | grep -E '^total:' | awk '{print $3}' | sed 's/%//')
          if [ -z "$COVERAGE" ]; then
            echo "⚠️  Could not compute coverage"
            exit 1
          fi
          echo "Total coverage: $COVERAGE%"
          THRESHOLD=50
          if awk "BEGIN {exit !($COVERAGE < $THRESHOLD)}"; then
            echo "❌ Coverage $COVERAGE% is below $THRESHOLD% threshold"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets threshold"

      - name: Build Check (all binaries)
        run: |
          go build ./...
          go build -o bin/gateway    ./cmd/gateway
          go build -o bin/scheduler  ./cmd/scheduler
          go build -o bin/worker     ./cmd/worker
          go build -o bin/dolphinctl ./cmd/dolphinctl
          echo "Built: $(ls bin/)"

  # ═══════════ Stage 2: Docker 镜像可构建 ═══════════
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 4 images
        run: |
          docker build -t dolphin-gateway:latest   -f deployments/docker/Dockerfile.gateway   .
          docker build -t dolphin-scheduler:latest -f deployments/docker/Dockerfile.scheduler .
          docker build -t dolphin-worker:latest    -f deployments/docker/Dockerfile.worker    .
          docker build -t dolphinctl:latest        -f deployments/docker/Dockerfile.dolphinctl .

      - name: Verify images
        run: docker image inspect dolphin-gateway:latest dolphin-scheduler:latest dolphin-worker:latest dolphinctl:latest >/dev/null

  # ═══════════ Stage 3: 真实集群 E2E（kind）═══════════
  k8s-e2e:
    name: K8s E2E (kind)
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-images]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install kind
        run: |
          curl -sSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          curl -sSL -o /tmp/kubectl "https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      # 一键脚本：起 kind → 构建/加载镜像 → 部署 → V1 网关 / V2 选主 / V3 任务执行
      - name: K8s E2E
        run: bash hack/k8s_ci_e2e.sh
