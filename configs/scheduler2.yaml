server:
  grpc_port: 50052
  http_port: 9092
etcd:
  endpoints:
    - localhost:2379
  dial_timeout: 5s
election:
  ttl: 15
mysql:
  dsn: root:dolphin@tcp(localhost:3306)/dolphin?parseTime=true&charset=utf8mb4
redis:
  addr: localhost:6379
  password: ""
  db: 0
reconciler:
  # 与 scheduler.yaml 保持一致：并发足够高才能打满 worker 池，让背压/重试机制可达。
  workers: 50
failover:
  heartbeat_timeout: 30s
  max_retries: 3
