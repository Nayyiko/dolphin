server:
  grpc_port: 50051
  http_port: 9090
etcd:
  endpoints:
    - localhost:2379
  dial_timeout: 5s
election:
  ttl: 15
mysql:
  dsn: root:dolphin@tcp(localhost:3306)/dolphin?parseTime=true&charset=utf8mb4
redis:
  addr: localhost:6379
  password: ""
  db: 0
reconciler:
  workers: 4
failover:
  heartbeat_timeout: 30s
  max_retries: 3
  retry_base_delay: 2s
  stale_running_grace: 30s
