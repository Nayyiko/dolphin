server:
  grpc_port: 50051
  http_port: 9090
etcd:
  endpoints:
    - localhost:2379
  dial_timeout: 5s
election:
  ttl: 15
mysql:
  dsn: root:dolphin@tcp(localhost:3306)/dolphin?parseTime=true&charset=utf8mb4
redis:
  addr: localhost:6379
  password: ""
  db: 0
reconciler:
  # 并行 reconcile goroutine 数。必须足够高才能把 worker 池在途上限打满
  # （capacity 50 + 队列 100 = 150），否则"池满背压 → 自动重试"机制永远够不到。
  # 经验值：4 只能维持 ~30 tasks/s 分发，远低于打满 150 所需的 75+/s。
  workers: 50
failover:
  heartbeat_timeout: 30s
  max_retries: 3
  retry_base_delay: 2s
  stale_running_grace: 30s
